# ============================================================
# 天链机器人 ROS2 工作空间 — GitHub Actions CI（日常验证）
#
# 流程:
#   format-check — 格式检查（clang-format 检查 C++ + black 检查 Python）
#   build        — tl_driver 编译验证（x86_64 + arm64 矩阵，
#                  实现见可复用工作流 build.yml）
#
# 触发规则:
#   - push 到 master/dev/V2 → 格式检查 + tl_driver 构建（V2 为独立版本线）
#   - 所有 pull_request  → 格式检查 + tl_driver 构建
#   - 仅改动文档（**.md、docs/**）时不触发（改 .github/** 仍会触发）
#
# 构建范围仅限 tl_driver（含其依赖 tl_ros2_interface）: 其余包依赖
# MoveIt/RViz/ros2_control 全量依赖，体积与耗时不成比例，仍由本地
# Docker 开发环境做全量编译验证。
#
# 环境: clang-format / black 经 pip 固定版本（14.0.6 / 26.5.1），
# 与本地工具链一致，避免版本漂移导致 CI 误报。
#
# 打标签发布流程见 .github/workflows/release.yml
# ============================================================
name: CI

on:
  push:
    branches: [master, dev, V2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 同分支新提交推送时取消仍在跑的旧 CI，节省分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 格式检查
  #   C++: scripts/format-cpp.sh 只支持原地格式化（clang-format -i），
  #        因此检查方式: 先格式化，再 git diff --exit-code 判断是否产生变更。
  #        自动跳过预编译 SDK 头文件（src/*/lib/include/）。
  #   Python: black --check（版本与仓库重排所用版本一致，配置见 pyproject.toml）
  #   clang-format / black 均经 pip 固定版本，保证跨机器格式化结果一致；
  #   不在容器里跑 git diff：容器 job 中 step 进程存在仓库发现问题
  #   （实测 actions/checkout 成功后 git diff 仍报 Not a git repository）
  # ----------------------------------------------------------
  format-check:
    name: 格式检查 (clang-format + black)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装格式检查工具
        run: pip install clang-format==14.0.6 black==26.5.1

      - name: 检查 C++ 格式
        run: |
          ./scripts/format-cpp.sh
          if ! git diff --exit-code --stat; then
            echo "::error::存在未格式化的 C++ 文件，请运行 ./scripts/format-cpp.sh 后提交"
            exit 1
          fi

      - name: 检查 Python 格式
        run: |
          if ! black --check .; then
            echo "::error::存在未格式化的 Python 文件，请运行 black . 后提交"
            exit 1
          fi

  # ----------------------------------------------------------
  # tl_driver 构建 — 复用 build.yml，矩阵内跑 linux-x86_64 与
  # linux-arm64 两种架构；与格式检查互不依赖，可并行
  # ----------------------------------------------------------
  build:
    name: tl_driver 构建
    uses: ./.github/workflows/build.yml
