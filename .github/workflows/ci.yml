# ============================================================
# 天链机器人 ROS2 工作空间 — GitHub Actions CI（日常验证）
#
# 流程: format-check — 格式检查（clang-format 检查 C++ + black 检查 Python）
#
# 触发规则:
#   - push 到 master/dev → 格式检查
#   - 所有 pull_request  → 格式检查
#   - 仅改动文档（**.md、docs/**）或 CI 配置（.github/**）时不触发
#
# 不做 CI 构建: 依赖环境过重（MoveIt/RViz/ros2_control 全量安装），
# 编译验证由本地 Docker 开发环境完成。
#
# 环境: 格式检查容器用 ubuntu:22.04（clang-format 14），与本地工具链
# 版本一致，避免 clang-format 新版本格式化结果漂移导致 CI 误报。
#
# 打标签发布流程见 .github/workflows/release.yml
# ============================================================
name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# 同分支新提交推送时取消仍在跑的旧 CI，节省分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 格式检查
  #   C++: scripts/format-cpp.sh 只支持原地格式化（clang-format -i），
  #        因此检查方式: 先格式化，再 git diff --exit-code 判断是否产生变更。
  #        自动跳过预编译 SDK 头文件（src/*/lib/include/）。
  #   Python: black --check（版本与仓库重排所用版本一致，配置见 pyproject.toml）
  # ----------------------------------------------------------
  format-check:
    name: 格式检查 (clang-format + black)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: 安装格式检查工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git clang-format python3-pip

      - uses: actions/checkout@v4

      - name: 安装 black（版本锁定，保证格式化结果与本地一致）
        run: pip3 install black==26.5.1

      - name: 检查 C++ 格式
        run: |
          ./scripts/format-cpp.sh
          if ! git diff --exit-code --stat; then
            echo "::error::存在未格式化的 C++ 文件，请运行 ./scripts/format-cpp.sh 后提交"
            exit 1
          fi

      - name: 检查 Python 格式
        run: |
          if ! black --check .; then
            echo "::error::存在未格式化的 Python 文件，请运行 black . 后提交"
            exit 1
          fi
